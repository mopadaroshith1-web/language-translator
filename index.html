<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">🌐</div>

            <div>
                <h1>Language Translator</h1>
                <p>Translate text quickly and easily</p>
            </div>
        </header>


        <!-- Language Selection -->
        <section class="language-section">

            <div class="language-box">
                <label for="sourceLanguage">From</label>

                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="ru">Russian</option>
                </select>
            </div>


            <button id="swapBtn" class="swap-btn" title="Swap languages">
                ⇄
            </button>


            <div class="language-box">
                <label for="targetLanguage">To</label>

                <select id="targetLanguage">
                    <option value="te">Telugu</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="ru">Russian</option>
                </select>
            </div>

        </section>


        <!-- Translation Area -->
        <section class="translator">

            <!-- Input -->
            <div class="text-card">

                <div class="card-header">
                    <span>Enter text</span>
                    <span id="charCount">0 / 5000</span>
                </div>

                <textarea
                    id="inputText"
                    maxlength="5000"
                    placeholder="Type or paste your text here..."
                ></textarea>

            </div>


            <!-- Translate Button -->
            <button id="translateBtn" class="translate-btn">
                Translate
            </button>


            <!-- Output -->
            <div class="text-card result-card">

                <div class="card-header">
                    <span>Translation</span>
                    <span id="status"></span>
                </div>

                <div id="resultText" class="result-text">
                    Your translated text will appear here...
                </div>

            </div>


            <!-- Action Buttons -->
            <div class="actions">

                <button id="copyBtn" class="action-btn">
                    📋 Copy
                </button>

                <button id="listenBtn" class="action-btn">
                    🔊 Listen
                </button>

                <button id="clearBtn" class="action-btn">
                    🗑️ Clear
                </button>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>Language Translation Tool</p>
            <span>College Project</span>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
